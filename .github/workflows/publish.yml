name: publish-1.7.1
on:
  push:
    branches: [claude/project-thread-b5m0n6]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or update v1.7.1
        run: |
          if gh release view v1.7.1 >/dev/null 2>&1; then
            gh release edit v1.7.1 --notes-file notes.md --title "Senko FX 1.7.1" --latest
          else
            gh release create v1.7.1 --target main --title "Senko FX 1.7.1" --notes-file notes.md --latest
          fi
          gh release upload v1.7.1 assets/SenkoFX-Setup-1.7.1.zip assets/SenkoFX-plugins-1.7.1.zip assets/senkofx-latest.json --clobber
      - name: Banner on 1.7.0
        run: |
          gh release view v1.7.0 --json body -q .body > old.md
          if ! grep -q "newer version" old.md; then
            { echo '> **A newer version is out:** [Senko FX 1.7.1](https://github.com/yur0fx/SenkoFX/releases/latest), which updates itself from then on.'; echo; cat old.md; } > new.md
            gh release edit v1.7.0 --notes-file new.md
          fi
      - name: Verify downloads
        run: |
          sleep 10
          for f in SenkoFX-Setup-1.7.1.zip SenkoFX-plugins-1.7.1.zip senkofx-latest.json; do
            for i in 1 2 3 4 5; do curl -fsSL -o dl_$f "https://github.com/${GH_REPO}/releases/latest/download/$f" && break; sleep 15; done
            cmp dl_$f assets/$f && echo "OK $f"
          done
      - name: README and image to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          cp README.md /tmp/README.md && cp images/new-in-1.7.0.png /tmp/new.png
          git fetch origin main && git checkout -B main origin/main
          cp /tmp/README.md README.md && mkdir -p images && cp /tmp/new.png images/new-in-1.7.0.png
          git add README.md images/new-in-1.7.0.png
          git diff --cached --quiet || git commit -m "Senko FX 1.7.1: README"
          git push origin main
